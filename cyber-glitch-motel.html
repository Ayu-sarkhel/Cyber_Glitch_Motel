<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>THE ARCHON LOOP — Cyber-Glitch Motel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--cy:#27f0ff;--mg:#ff2bd6;--rd:#ff2d55;--yl:#ffd23f;--gr:#39ff88;--ink:#05040a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05040a;overflow:hidden;font-family:'VT323',ui-monospace,monospace;color:#d8fff4;-webkit-tap-highlight-color:transparent}
canvas{display:block;touch-action:none;cursor:crosshair}
canvas.gl{animation:gl .38s steps(5)}
@keyframes gl{20%{transform:translateX(-8px) skewX(2deg);filter:hue-rotate(80deg) saturate(2)}52%{transform:translateX(10px);filter:hue-rotate(-50deg) contrast(1.4)}80%{transform:translateX(-3px);filter:invert(.15)}}

#ui{position:fixed;inset:0;z-index:10;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
body.playing #ui{opacity:1;visibility:visible}
#ui button{pointer-events:auto}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0}
.panel{background:rgba(6,4,14,.74);border:1px solid rgba(39,240,255,.32);padding:5px 11px 7px;backdrop-filter:blur(2px)}
#left{max-width:min(42vw,330px)}
#chapter{font-size:clamp(13px,1.9vw,19px);color:var(--cy);letter-spacing:1.5px;line-height:1.1}
#scanline{font-size:clamp(11px,1.5vw,15px);color:#7fd6c8;letter-spacing:2px}
#archon{margin-top:5px;font-size:clamp(11px,1.5vw,15px);line-height:1.25;font-style:italic;color:#ff9be9;display:none}
#archon.on{display:block;animation:ar .5s}
@keyframes ar{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
#timerwrap{text-align:center;min-width:clamp(96px,16vw,150px);padding:4px 10px 8px}
#timer{font-size:clamp(30px,4.6vw,50px);line-height:.92;color:var(--cy);text-shadow:0 0 14px rgba(39,240,255,.5)}
#timer.low{color:var(--rd);text-shadow:0 0 16px rgba(255,45,85,.7);animation:pul .7s infinite}
@keyframes pul{50%{opacity:.45}}
#tbar{height:5px;margin-top:5px;background:#150e28;border:1px solid #2a2050;overflow:hidden}
#tbarFill{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--cy),var(--mg));transition:width .15s linear}
#right{text-align:right;min-width:84px}
#lives{font-size:clamp(14px,2vw,20px);letter-spacing:2px;color:var(--rd);white-space:nowrap}
#score{font-size:clamp(14px,2vw,20px);color:var(--yl)}
#objective{position:absolute;top:calc(env(safe-area-inset-top,0px) + 78px);left:0;right:0;text-align:center;padding:0 14px;font-size:clamp(14px,2.1vw,20px);color:#bff2ff;text-shadow:0 2px 7px #000;line-height:1.2}
#objective b{color:#fff;border-bottom:1px solid var(--cy)}
#clue{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 106px);text-align:center;padding:4px 16px;font-size:clamp(14px,2vw,19px);color:var(--yl);line-height:1.25;opacity:0;transition:opacity .3s;background:linear-gradient(90deg,transparent,rgba(3,2,10,.88) 18%,rgba(3,2,10,.88) 82%,transparent);text-shadow:0 1px 3px #000}
#clue.on{opacity:1}
#msg{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 74px);width:min(760px,94vw);text-align:center;font-size:clamp(14px,2vw,19px);line-height:1.25;color:#fff;padding:5px 10px;opacity:0;transition:opacity .25s}
#msg.on{opacity:1;background:rgba(3,2,10,.86);border-left:2px solid var(--cy);border-right:2px solid var(--cy)}
#msg.bad{border-color:var(--rd);color:#ffd6de}
#msg.good{border-color:var(--gr);color:#d9ffe8}
#msg.warn{border-color:var(--yl);color:#fff2c9}
#btns{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:0 8px calc(env(safe-area-inset-bottom,0px) + 14px)}
#btns button{font:inherit;font-size:clamp(14px,2.05vw,22px);letter-spacing:1px;padding:9px clamp(9px,1.7vw,20px);background:rgba(6,4,16,.9);border:2px solid;color:inherit;cursor:pointer;line-height:1.1;transition:background .12s,box-shadow .12s,transform .08s}
#btns button:active{transform:translateY(1px)}
#btns button:disabled{opacity:.28;cursor:not-allowed}
#btns kbd{font-family:inherit;font-size:.62em;opacity:.55;border:1px solid currentColor;padding:0 3px;margin-left:4px;vertical-align:middle}
#rep{color:var(--mg);border-color:var(--mg)}
#stb{color:var(--cy);border-color:var(--cy)}
#hint{color:var(--yl);border-color:var(--yl)}
#rep:hover:not(:disabled){background:var(--mg);color:#14000f;box-shadow:0 0 22px var(--mg)}
#stb:hover:not(:disabled){background:var(--cy);color:#001016;box-shadow:0 0 22px var(--cy)}
#hint:hover:not(:disabled){background:var(--yl);color:#181000;box-shadow:0 0 22px var(--yl)}
#btns .mini{font-size:clamp(14px,1.9vw,20px);padding:9px 12px;color:#9fe8dd;border-color:#3d6f74}
#btns .mini:hover{background:#0d2a30;color:#fff}
#mark{position:absolute;transform:translate(-50%,-100%);background:#12001a;border:1px solid var(--mg);color:#ffd6f9;font-size:clamp(11px,1.6vw,15px);letter-spacing:1px;padding:2px 7px;white-space:nowrap;display:none;box-shadow:0 0 14px rgba(255,43,214,.5)}
#mark:after{content:'';position:absolute;left:50%;top:100%;width:1px;height:12px;background:var(--mg)}
#tip{position:absolute;pointer-events:none;font-size:clamp(11px,1.6vw,15px);color:var(--cy);background:rgba(0,0,0,.82);padding:1px 7px;border:1px solid rgba(39,240,255,.5);display:none;white-space:nowrap}
#arrow{position:absolute;font-size:clamp(28px,4vw,46px);line-height:1;color:var(--yl);text-shadow:0 0 14px var(--yl),0 0 3px #000;display:none}
#dp{position:absolute;left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 78px);display:none;grid-template-areas:'. w .' 'a s d';gap:4px;pointer-events:none}
#dp button{pointer-events:auto;font:inherit;font-size:22px;padding:5px 13px;background:rgba(6,4,16,.8);border:1px solid rgba(39,240,255,.45);color:var(--cy)}
#dp [data-k=w]{grid-area:w}#dp [data-k=a]{grid-area:a}#dp [data-k=s]{grid-area:s}#dp [data-k=d]{grid-area:d}
@media (max-width:620px){
  #left{max-width:53vw}
  #chapter{font-size:12px}
  #scanline{font-size:10px}
  #archon{font-size:10px;max-height:2.8em;overflow:hidden}
  #timerwrap{min-width:82px;padding:4px 6px 7px}
}
@media (max-width:620px),(pointer:coarse){
  #btns{gap:5px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
  #btns button{font-size:12px;padding:7px 8px;letter-spacing:.2px;border-width:1px}
  #btns kbd{display:none}
  #btns .mini{padding:7px 9px}
}
@media (pointer:coarse){
  #dp{display:grid}
  #clue{padding:0 16px 0 128px}
  #objective{top:calc(env(safe-area-inset-top,0px) + 96px)}
  #msg{width:92vw;font-size:14px}
}
@media (max-width:560px){
  #objective{top:calc(env(safe-area-inset-top,0px) + 104px);font-size:13px;padding:0 10px}
  #archon{font-size:11px}
}
#flash{position:fixed;inset:0;z-index:20;opacity:0;pointer-events:none;transition:opacity .35s}

#screen{position:fixed;inset:0;z-index:30;display:none;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 20px);overflow-y:auto;background:radial-gradient(ellipse at 50% 22%,rgba(46,10,66,.92),rgba(3,2,8,.975) 70%)}
#screen.on{display:flex;align-items:center;justify-content:center}
.card{width:min(740px,100%);margin:auto;border:1px solid rgba(39,240,255,.42);background:linear-gradient(180deg,rgba(10,7,22,.95),rgba(5,4,13,.97));padding:clamp(18px,4vw,42px);box-shadow:0 0 70px rgba(255,43,214,.16),inset 0 0 60px rgba(39,240,255,.05);position:relative}
.card:before{content:'';position:absolute;inset:6px;border:1px solid rgba(255,43,214,.18);pointer-events:none}
.eyebrow{font-size:clamp(11px,1.8vw,15px);letter-spacing:4px;color:var(--mg);margin:0 0 10px;text-transform:uppercase}
.card h1{font-size:clamp(26px,5.4vw,50px);font-weight:400;margin:0 0 4px;line-height:1.03;color:#fff;text-shadow:0 0 20px rgba(39,240,255,.55)}
.sub{color:var(--cy);font-size:clamp(13px,2.1vw,18px);letter-spacing:2.5px;margin:0 0 16px;text-transform:uppercase}
.body{font-size:clamp(16px,2.4vw,21px);line-height:1.42;color:#cfeee8;white-space:pre-wrap;min-height:1em}
.body em{font-style:italic;color:var(--yl)}
.body .sys{color:#ff9be9}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.actions button{font:inherit;font-size:clamp(15px,2.3vw,21px);letter-spacing:1.5px;padding:10px 20px;background:transparent;border:2px solid var(--cy);color:var(--cy);cursor:pointer}
.actions button:hover{background:var(--cy);color:#001016;box-shadow:0 0 24px var(--cy)}
.actions button.alt{border-color:#5b7a80;color:#9fc9c3}
.actions button.alt:hover{background:#1a2e33;color:#fff;box-shadow:none}
.actions button.warm{border-color:var(--yl);color:var(--yl)}
.actions button.warm:hover{background:var(--yl);color:#181000;box-shadow:0 0 24px var(--yl)}
.rules{margin:16px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:clamp(14px,2.1vw,18px);color:#a9d8d0}
.rules li:before{content:'▸ ';color:var(--mg)}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:14px}
.legend div{border:1px solid rgba(39,240,255,.22);background:rgba(39,240,255,.04);padding:6px 9px;font-size:clamp(13px,2vw,17px);line-height:1.25}
.legend b{color:var(--yl);font-weight:400;letter-spacing:1px;display:block}
.low{color:var(--rd)}
#loadfail{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;background:#05040a;color:#ff9be9;font-size:22px}
</style>

<body>

<div id="ui">
  <div id="hud">
    <div class="panel" id="left">
      <div id="chapter">CHAPTER I · ROOM 304</div>
      <div id="scanline">SCAN 1 / 6</div>
      <div id="archon"></div>
    </div>
    <div class="panel" id="timerwrap">
      <div id="timer">80</div>
      <div id="tbar"><i id="tbarFill"></i></div>
    </div>
    <div class="panel" id="right">
      <div id="lives">♥ ♥ ♥</div>
      <div id="score">0</div>
    </div>
  </div>
  <div id="objective">&nbsp;</div>

    <button id="rep">REPORT GLITCH<kbd>R</kbd></button>

</div>

<div id="flash"></div>

<script>
(function(){
'use strict';
if(typeof THREE==='undefined') return;
const T=THREE, $=id=>document.getElementById(id), R=Math.random;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[R()*a.length|0];

/* =========================================================
   AUDIO — procedural synth: ambience + music + cues
   ========================================================= */
const SFX=(()=>{
  let ctx=null, master=null, music=null, fx=null, muted=false, ambGain=null, ambNodes=[], started=false;

  function boot(){
    if(ctx){ if(ctx.state==='suspended') ctx.resume(); return ctx; }
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return null;
    ctx=new AC();
    master=ctx.createGain(); master.gain.value=muted?0:.85;
    const comp=ctx.createDynamicsCompressor();
    comp.threshold.value=-16; comp.knee.value=20; comp.ratio.value=6; comp.attack.value=.003; comp.release.value=.25;
    master.connect(comp); comp.connect(ctx.destination);
    music=ctx.createGain(); music.gain.value=.30; music.connect(master);
    fx=ctx.createGain(); fx.gain.value=.8; fx.connect(master);
    started=true;
    return ctx;
  }
  const now=()=>ctx?ctx.currentTime:0;

  function tone(freq,o){
    o=o||{};
    if(!boot()) return;
    const dur=o.dur||.15, vol=o.vol==null?.18:o.vol, type=o.type||'sine';
    const t0=now()+(o.delay||0), at=Math.min(o.attack||.008,dur*.5);
    const osc=ctx.createOscillator(), g=ctx.createGain();
    osc.type=type; osc.frequency.setValueAtTime(freq,t0);
    if(o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.slide),t0+dur);
    g.gain.setValueAtTime(.0001,t0);
    g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t0+at);
    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    osc.connect(g); g.connect(o.bus||fx);
    osc.start(t0); osc.stop(t0+dur+.04);
  }

  function noise(o){
    o=o||{};
    if(!boot()) return;
    const dur=o.dur||.25, vol=o.vol==null?.15:o.vol;
    const t0=now()+(o.delay||0);
    const len=Math.max(1,Math.ceil(ctx.sampleRate*dur));
    const buf=ctx.createBuffer(1,len,ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.6);
    const src=ctx.createBufferSource(); src.buffer=buf;
    const bp=ctx.createBiquadFilter();
    bp.type=o.type||'bandpass'; bp.Q.value=o.q||1;
    bp.frequency.setValueAtTime(o.f||900,t0);
    if(o.sweep) bp.frequency.exponentialRampToValueAtTime(Math.max(40,o.sweep),t0+dur);
    const g=ctx.createGain();
    g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    src.connect(bp); bp.connect(g); g.connect(o.bus||fx);
    src.start(t0); src.stop(t0+dur);
  }

  function ambience(root,mood){
    if(!boot()) return;
    stopAmbience();
    const at=now();
    ambGain=ctx.createGain();
    ambGain.gain.setValueAtTime(.0001,at);
    ambGain.gain.exponentialRampToValueAtTime(.55,at+2.5);
    ambGain.connect(music);

    const lp=ctx.createBiquadFilter();
    lp.type='lowpass'; lp.frequency.value=mood==='core'?520:820; lp.Q.value=.8;
    lp.connect(ambGain);

    [[1,.5,'triangle'],[1.5,.16,'sine'],[2.003,.11,'sine'],[.5,.26,'sine']].forEach(function(spec){
      const osc=ctx.createOscillator(); osc.type=spec[2]; osc.frequency.value=root*spec[0];
      const g=ctx.createGain(); g.gain.value=spec[1];
      osc.connect(g); g.connect(lp); osc.start(at); ambNodes.push(osc);
    });

    const lfo=ctx.createOscillator(); lfo.frequency.value=.07;
    const lg=ctx.createGain(); lg.gain.value=mood==='core'?300:190;
    lfo.connect(lg); lg.connect(lp.frequency); lfo.start(at); ambNodes.push(lfo);

    const len=ctx.sampleRate*2, buf=ctx.createBuffer(1,len,ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*.5;
    const ns=ctx.createBufferSource(); ns.buffer=buf; ns.loop=true;
    const nf=ctx.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=1300; nf.Q.value=.6;
    const ng=ctx.createGain(); ng.gain.value=.055;
    ns.connect(nf); nf.connect(ng); ng.connect(ambGain); ns.start(at); ambNodes.push(ns);

    if(mood==='core'){
      const pulse=ctx.createOscillator(); pulse.type='sine'; pulse.frequency.value=root*.5;
      const pg=ctx.createGain(); pg.gain.value=.12;
      const trem=ctx.createOscillator(); trem.frequency.value=1.7;
      const tg=ctx.createGain(); tg.gain.value=.1;
      trem.connect(tg); tg.connect(pg.gain); trem.start(at);
      pulse.connect(pg); pg.connect(ambGain); pulse.start(at);
      ambNodes.push(pulse,trem);
    }
    startMusic(root,mood);
  }
  function stopAmbience(){
    if(!ctx||!ambGain) return;
    const at=now(), g=ambGain, nodes=ambNodes;
    try{
      g.gain.cancelScheduledValues(at);
      g.gain.setValueAtTime(Math.max(.0001,g.gain.value),at);
      g.gain.exponentialRampToValueAtTime(.0001,at+1.1);
    }catch(e){}
    nodes.forEach(function(n){ try{n.stop(at+1.3)}catch(e){} });
    ambNodes=[]; ambGain=null;
  }

  /* ---- procedural music ---- */
  let mTimer=null, mGain=null, mStep=0, mNext=0, mRoot=55, mBpm=96, mMood=null, mNoise=null;
  const PROG=[[0,3,7,10],[-4,0,3,7],[-2,2,5,9],[-5,-2,2,5]];
  const ARP=[0,1,2,3,2,1,2,3];
  const hz=(r,s)=>r*Math.pow(2,s/12);
  function mNote(f,t,d,type,v,cut,a){
    const o=ctx.createOscillator(), g=ctx.createGain(), lp=ctx.createBiquadFilter();
    o.type=type; o.frequency.value=f;
    lp.type='lowpass'; lp.frequency.value=cut||1800;
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(v,t+(a||.01));
    g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(lp); lp.connect(g); g.connect(mGain);
    o.start(t); o.stop(t+d+.05);
  }
  function mKick(t){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.frequency.setValueAtTime(130,t); o.frequency.exponentialRampToValueAtTime(40,t+.14);
    g.gain.setValueAtTime(.5,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22);
    o.connect(g); g.connect(mGain); o.start(t); o.stop(t+.25);
  }
  function mHit(t,f,d,v){
    const s=ctx.createBufferSource(); s.buffer=mNoise;
    const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=f;
    const g=ctx.createGain();
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(hp); hp.connect(g); g.connect(mGain); s.start(t); s.stop(t+d+.02);
  }
  function mPlay(n,t){
    const ch=PROG[(n>>4)&3], b=n&15, bar=60/mBpm*4;
    if(b===0) ch.forEach(function(s){ mNote(hz(mRoot*2,s),t,bar*.98,'sawtooth',.03,650,.5); });
    if(b%2===0) mNote(hz(mRoot,ch[0]+(b%8===6?12:0)),t,.2,'sawtooth',.15,420);
    mNote(hz(mRoot*4,ch[ARP[b%8]]),t,.16,'triangle',.05,2400);
    if(b===0||b===8) mKick(t);
    if(b===4||b===12) mHit(t,1400,.16,.12);
    if(b%2===1) mHit(t,7000,.04,.05);
  }
  function mTick(){
    const spb=60/mBpm/4;
    while(mNext<ctx.currentTime+.3){ mPlay(mStep,mNext); mNext+=spb; mStep++; }
  }
  function startMusic(root,mood){
    if(!boot()) return;
    if(mTimer&&mMood===mood) return;
    stopMusic();
    mMood=mood; mRoot=root; mStep=0;
    mBpm=mood==='room'?96:mood==='alley'?88:80;
    if(!mNoise){
      mNoise=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
      const d=mNoise.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    }
    mGain=ctx.createGain();
    mGain.gain.setValueAtTime(.0001,now());
    mGain.gain.exponentialRampToValueAtTime(.6,now()+2);
    mGain.connect(master);
    mNext=now()+.1;
    mTimer=setInterval(mTick,100);
  }
  function stopMusic(){
    if(!mTimer) return;
    clearInterval(mTimer); mTimer=null; mMood=null;
    const g=mGain, t=now();
    try{ g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(Math.max(.0001,g.gain.value),t); g.gain.exponentialRampToValueAtTime(.0001,t+1.2); }catch(e){}

const cvs=(w,h,draw,rep)=>{
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new T.CanvasTexture(c);
  t.encoding=T.sRGBEncoding;
  t.anisotropy=rd.capabilities.getMaxAnisotropy();
  if(rep){ t.wrapS=t.wrapT=T.RepeatWrapping; t.repeat.set(rep[0],rep[1]); }
  return t;
};
const noiseSprinkle=(g,w,h,n,a)=>{
  for(let i=0;i<n;i++){
    g.fillStyle=(R()<.5?'rgba(255,255,255,':'rgba(0,0,0,')+(R()*a)+')';
    g.fillRect(R()*w,R()*h,2+R()*3,2+R()*3);
  }
};

function animPerson(dt,t,mv){
  const r=me&&me.userData.rig; if(!r) return;
  r.a+=(mv-r.a)*Math.min(1,dt*10);
  r.ph+=dt*9*r.a;
  const a=r.a, I=1-a;
  r.lg.forEach(function(q,i){
    const ph=r.ph+(i?Math.PI:0);
    q[0].rotation.x=Math.sin(ph)*.55*a;
    q[1].rotation.x=Math.max(0,-Math.cos(ph))*.9*a+.04;
  });
  r.ar.forEach(function(q,i){
    const ph=r.ph+(i?Math.PI:0), s=i?1:-1;
    q[0].rotation.x=-Math.sin(ph)*.5*a+Math.sin(t*1.3+i)*.02*I;
    q[0].rotation.z=s*(.05+.02*Math.sin(t*1.6));
    q[1].rotation.x=-.2-.35*a;
  });
  r.tg.scale.x=1+Math.sin(t*1.7)*.012;
  r.tg.scale.z=.72*(1+Math.sin(t*1.7)*.02);
  r.tg.rotation.y=Math.sin(r.ph)*.1*a;
  const pp=me.position;
  const ang=Math.atan2(cam.position.x-pp.x,cam.position.z-pp.z)-me.rotation.y;
  const w=Math.atan2(Math.sin(ang),Math.cos(ang));
  const lk=Math.abs(w)<1.6?clamp(w,-.8,.8):0;
  r.hg.rotation.y+=(lk-r.hg.rotation.y)*Math.min(1,dt*4);
  r.hg.rotation.x=Math.sin(t*.8)*.02-.02;
  r.bl-=dt;
  if(r.bl<0){ r.bt=.16; r.bl=2+R()*4; }
  if(r.bt>0) r.bt-=dt;
  const lid=-.15+(r.bt>0?Math.sin(r.bt/.16*Math.PI)*1.4:0);
  r.lids.forEach(function(l){ l.rotation.x=lid; });
  me.position.y=Math.abs(Math.sin(r.ph))*.03*a;
}

  ghost:{label:'PHASE-OUT',clue:'an object is fading toward transparent',guide:'Half gone — you can see through it.'},
  giant:{label:'SCALE UP',clue:'an object has grown far too large',guide:'Roughly twice its proper size.'},
  tiny:{label:'SCALE DOWN',clue:'an object has shrunk',guide:'A fraction of its proper size.'},
  tilt:{label:'DISPLACEMENT',clue:'an object is leaning at a wrong angle',guide:'Tilted as if gravity changed direction.'},

function makePlan(){
  const p=[];
  for(let c=0;c<3;c++){
    p.push(true);
    p.push(R()<.4?true:R()<.45);
  }
  if(p.indexOf(false)<0) p[pick([1,3,5])]=false;
  return p;
}

function startRun(){
  if(F){ sc.remove(F); F=null; }
  SFX.boot();
  score=0; lives=START_LIVES; streak=0; scanIdx=0; plan=makePlan();
  target=null; selected=null; hovered=null; purgeObj=null; hintTargetReset();
  paused=false; hideScreen();
  if(G){ sc.remove(G); G=null; }
  buildScene(0);
  updateHUD();
  document.body.classList.remove('playing');
  state='story';
  showChapterCard();
}
function hintTargetReset(){ signalUntil=0; signalWasOn=false; hintRing.visible=false; selBox.visible=false; }

function showChapterCard(){
  document.body.classList.remove('playing');
  state='story';
  const C=CHAPTERS[0];
  showScreen({
    eyebrow:'CHAPTER I · SCANS 1–2',
    title:C.name,
    sub:C.tag,
    body:C.intro,
    actions:[['BEGIN THE FIRST SCAN',null,function(){ hideScreen(); startScan(); }],
             ['ANOMALY GUIDE','alt',function(){ showGuide(false); }]]
  });
}

function startScan(){
  const chapter=scanIdx>>1;
  buildScene(chapter);
  target=null; selected=null; hovered=null; purgeObj=null; hintTargetReset();
  hintsLeft=2; lastTick=99;

  if(plan[scanIdx]){
    const kind=pick(KIND_IDS);
    const o=pickTarget(kind);
    if(o){ target=o; mutate(o,kind); }
  }
  const subtle=target&&SUBTLE.indexOf(target.userData.an)>=0;
  clueAt=target?(subtle?[14,34,54]:[24,46,66]):[30,52,999];
  clueLevel=0; clueBase=''; el.clue.textContent=''; el.clue.classList.remove('on');

  timeLimit=SCAN_TIME; timeLeft=SCAN_TIME; t0=performance.now();
  state='play'; paused=false;
  document.body.classList.add('playing');
  enableButtons(true); updateHintBtn(); updateHUD();
  el.timer.textContent=SCAN_TIME; el.timer.classList.remove('low');
  el.tbarFill.style.width='100%';

  setObjective('<b>SCAN '+(scanIdx+1)+' / '+N_SCANS+'</b> · '+CHAPTERS[chapter].name+' — mark the corrupted object, or call <b>SYSTEM STABLE</b> if nothing is wrong.');
  if(scanIdx===0) toast('WASD / arrows to walk · drag to look · click an object to MARK it. Then decide.','warn');
  else toast('Scan live. Search the layer, then make the call.','warn');
  transmit(pick(ARCHON.start));
  glitchCanvas();
  SFX.glitch();
}

function pickTarget(kind){
  const pool=props.filter(function(o){ return !(o.userData.big&&kind==='giant'); });
  return pool.length?pick(pool):null;
}

function mutate(o,kind){
  o.userData.an=kind;
  o.userData.base={x:o.position.x,y:o.position.y,ry:o.rotation.y};
  const paint=function(fn){
    o.traverse(function(c){
      if(c.isMesh&&c.material){
        c.material=c.material.clone();
        if(fn) fn(c.material);
      }
    });
  };
  if(kind==='red'){
    const hot=new T.Color(0xff0018).convertSRGBToLinear();
    paint(function(m){
      if(m.emissive){ m.emissive.copy(hot); m.emissiveIntensity=1.9; }
      if(m.color) m.color.copy(hot);
    });
    const glow=new T.PointLight(0xff1030,2.4,4.5,1.4);
    glow.position.set(0,.35,0); o.add(glow);
    o.userData.redGlow=glow;
  }
  if(kind==='ghost') paint(function(m){ m.transparent=true; m.opacity=.3; m.depthWrite=false; });
  if(kind==='giant') o.scale.multiplyScalar(2);
  if(kind==='tiny') o.scale.multiplyScalar(.32);
  if(kind==='tilt') o.rotation.z=.55;
  if(kind==='drift') o.userData.base.x=o.position.x;
}

function animateProps(t){
  for(let i=0;i<props.length;i++){
    const o=props[i], k=o.userData.an;
    if(!k) continue;
    const b=o.userData.base;
    if(k==='float') o.position.y=b.y+.75+Math.sin(t*2)*.1;
    else if(k==='spin') o.rotation.y=b.ry+t*1.7;
    else if(k==='flicker') o.visible=Math.sin(t*22)>-.35;
    else if(k==='drift') o.position.x=b.x+Math.sin(t*.9)*.45;
    else if(k==='red'&&o.userData.redGlow) o.userData.redGlow.intensity=2+Math.sin(t*4.5)*1.2;
  }
}

function purge(o){
  purgeMax=Math.max(.05,o.scale.x);
  purgeObj=o; purgeT=performance.now(); SFX.glitch();
}

/* =========================================================
   ANSWERING
   ========================================================= */
function report(){
  if(state!=='play'||paused) return;
  if(!selected){ toast('Mark an object first — click it in the scene.','warn'); SFX.click(); return; }
  if(!target){
    fail('That object is clean — and this layer has no corruption at all. SYSTEM STABLE was the answer.');
    return;
  }
  if(selected===target) success();
  else fail('Wrong object. '+(selected.userData.label||'That').toUpperCase()+' is stable. The corruption is elsewhere.');
}

function stable(){
  if(state!=='play'||paused) return;
  if(target) fail('Wrong call. This layer IS corrupted — mark the object that looks wrong.');
  else success();
}

function success(){
  state='trans';
  enableButtons(false); el.hint.disabled=true;
  SFX.correct();
  flash('rgba(57,255,136,.28)');
  if(target) purge(target);
  const rem=Math.max(0,Math.ceil(timeLeft));
  streak++;
  const pts=120+rem*8+(streak-1)*30;
  score+=pts;
  updateHUD();
  toast('SCAN CLEAR  +'+pts+' pts'+(streak>1?'   ·   '+streak+'× STREAK':''),'good');
  transmit(target?pick(ARCHON.purge):pick(ARCHON.clean));
  setTimeout(function(){ if(state==='trans') afterScan(); },1500);
}

function fail(msg){
  lives--; streak=0; t0-=5000; shake=.6;
  SFX.wrong(); flash('rgba(255,45,85,.36)'); glitchCanvas();
  updateHUD();
  toast(msg+'   (−5s)','bad');
  transmit(pick(ARCHON.fail));
  if(lives<=0){
    state='trans';
    enableButtons(false); el.hint.disabled=true;
    setTimeout(function(){ gameOver('Three bad calls. The loop does not need you awake.'); },900);
  }
}

function afterScan(){
  scanIdx++;
  if(scanIdx>=N_SCANS){ finale(); return; }
  if(scanIdx%2===0){
    showInterlude(scanIdx/2-1);
  } else {
    startScan();
  }
}

  const sky=new T.Mesh(new T.SphereGeometry(70,32,20),new T.MeshBasicMaterial({map:skyTex,side:T.BackSide,fog:false,toneMapped:false}));

  B(motel,10.4,.3,.4,M(0x181425,.8,0),0,3.1,0);
  for(let i=0;i<5;i++){
    B(motel,1.1,2,.1,M(0x3a2f22,.8,0),-3.6+i*1.8,1,1.72);

    B(motel,1.1,.12,.12,M(0x1b1622,.7,0),-3.6+i*1.8,2.05,1.75);
  }
  for(let i=0;i<5;i++){
    const lamp=new T.Mesh(new T.SphereGeometry(.09,10,8),new T.MeshBasicMaterial({color:new T.Color(0xffd9a0).convertSRGBToLinear()}));
    lamp.position.set(-3.6+i*1.8,2.35,1.78); lamp.castShadow=false; motel.add(lamp);
    const pool=new T.PointLight(0xffc070,.5,3.2,1.4);
    pool.position.set(-3.6+i*1.8,2.3,2.2); motel.add(pool);
  }
  const sign=new T.Mesh(new T.PlaneGeometry(4.6,1.15),new T.MeshBasicMaterial({map:neonTex('VACANCY','#39ff88',512,128,74),toneMapped:false}));
  sign.position.set(0,3.9,1.7); motel.add(sign);
  const signGlow=new T.PointLight(0x39ff88,1.6,12,1.5);

  const sun=new T.DirectionalLight(0xffd9a0,0);
  sun.position.set(-9,10,-18); sun.castShadow=true;

function endingCamera(dt){

function whereIs(o){
  const x=o.position.x, z=o.position.z;
  const side=x<-.8?'left side':x>.8?'right side':'centre';
  const depth=z<-3?'far end':z<-1.2?'middle of the space':'near where you stand';
  return side+', '+depth;
}
function setClue(){
  if(target){
    const kind=KINDS[target.userData.an];
    if(clueLevel===1) clueBase='CORRUPTION SIGNATURE — '+kind.clue+'.';
    else if(clueLevel===2) clueBase='LOCATOR — the signature originates on the '+whereIs(target)+'.';
    else { clueBase='PINPOINT — the yellow ring marks the corruption.'; hintRing.visible=true; }
  } else {
    if(clueLevel===1) clueBase='SCANNER — no signature on the first pass. Keep looking.';
    else if(clueLevel===2) clueBase='SCANNER — no corruption signature in this layer.';
    else clueBase='SCANNER — the layer reads clean. SYSTEM STABLE would be correct.';
  }
  el.clue.textContent=clueBase;
  el.clue.classList.add('on');
  SFX.hint();
}
function useHint(){
  if(state!=='play'||paused||hintsLeft<=0) return;
  hintsLeft--;
  t0-=HINT_COST*1000;
  const first=(hintsLeft===1);
  if(!target){
    toast('SCANNER FINDS NO HOTSPOT — nothing in this layer reads as corrupted.  (−'+HINT_COST+'s)','warn');
  } else if(first){
    signalUntil=performance.now()+15000;
    toast('SIGNAL SWEEP ACTIVE for 15s — follow the arrow. Closer target = hotter signal.  (−'+HINT_COST+'s)','warn');
  } else {
    hintRing.visible=true;
    toast('PINPOINT LOCKED — the yellow ring marks the anomaly.  (−'+HINT_COST+'s)','warn');
  }
  SFX.hint(); flash('rgba(255,210,63,.14)');
  updateHintBtn();
}

const cv=rd.domElement;

function pickAt(cx,cy){
  ndc.set(cx/window.innerWidth*2-1, -(cy/window.innerHeight)*2+1);

  const hits=ray.intersectObjects(props,true);
  if(!hits.length) return null;
  let o=hits[0].object;
  while(o&&!o.userData.label) o=o.parent;
  return o||null;
}
cv.addEventListener('pointerdown',function(e){

});

    if(dragged){
      camYawT=clamp(camYawT+dx*.004,-.62,.62);
      camPitchT=clamp(camPitchT+dy*.0025,-.08,.34);
      down.x=e.clientX; down.y=e.clientY;
    }
  }
  if(state!=='play'||paused||dragged) return;

});

/* =========================================================
   LOOP
   ========================================================= */
let stepPhase=0, moving=0;
function movePlayer(dt){
  if(!me) return;
  const f=(K.w?1:0)-(K.s?1:0), r=(K.d?1:0)-(K.a?1:0);
  moving=0;
  if(f||r){
    const yaw=camYaw;
    const fx=-Math.sin(yaw), fz=-Math.cos(yaw);
    const rx=Math.cos(yaw), rz=-Math.sin(yaw);
    let dx=fx*f+rx*r, dz=fz*f+rz*r;
    const len=Math.hypot(dx,dz)||1;
    dx/=len; dz/=len;
    const speed=2.7;
    me.position.x=clamp(me.position.x+dx*speed*dt,-clip.xl,clip.xl);
    me.position.z=clamp(me.position.z+dz*speed*dt,clip.z0,clip.z1);
    const want=Math.atan2(dx,dz);
    let d=want-me.rotation.y; d=Math.atan2(Math.sin(d),Math.cos(d));
    me.rotation.y+=d*Math.min(1,dt*12);
    moving=1;
    stepPhase+=dt*8.5;
    if(stepPhase>Math.PI){ stepPhase-=Math.PI; SFX.step(); }
  }
}

function updateCamera(dt){
  camYaw+=(camYawT-camYaw)*Math.min(1,dt*6);
  camPitch+=(camPitchT-camPitch)*Math.min(1,dt*6);
  if(!me) return;
  const px=me.position.x, pz=me.position.z;
  const ax=px*.75+mx*.26, az=pz;
  const dist=4.3, ch=Math.cos(camPitch), shp=Math.sin(camPitch);
  const sx=shake>0?(R()-.5)*shake*.14:0;
  const sy=shake>0?(R()-.5)*shake*.14:0;
  let cx=ax+Math.sin(camYaw)*dist*ch+sx;
  let cz=az+Math.cos(camYaw)*dist*ch;
  cx=clamp(cx,-(clip.xl+.4),clip.xl+.4);
  cz=clamp(cz,clip.z0-.5,clip.z1+3.5);
  cam.position.set(cx,1.78+shp*dist+sy,cz);
  cam.lookAt(ax-Math.sin(camYaw)*2.4, 1.22-shp*1.6, az-Math.cos(camYaw)*2.4);
  shake=Math.max(0,shake-.022);
}

function updateTimer(now){
  timeLeft=timeLimit-(now-t0)/1000;
  if(timeLeft<=0){
    timeLeft=0;
    el.timer.textContent='0'; el.tbarFill.style.width='0%';
    gameOver('The scan window closed. The layer overwrote itself with you inside it.');
    return;
  }
  const rem=Math.ceil(timeLeft);
  el.timer.textContent=rem;
  el.timer.classList.toggle('low',timeLeft<=12);
  el.tbarFill.style.width=(timeLeft/timeLimit*100)+'%';
  if(timeLeft<=10){
    const s=Math.ceil(timeLeft);
    if(s!==lastTick){ lastTick=s; SFX.alarm(); }
  }
}

function updateClues(){
  const elapsed=timeLimit-timeLeft;
  if(clueLevel<3&&elapsed>=clueAt[clueLevel]){ clueLevel++; setClue(); }
}

function placeRing(ring,o,t){
  const b=new T.Box3().setFromObject(o);
  const c=b.getCenter(new T.Vector3());
  const size=b.getSize(new T.Vector3()).length();
  ring.visible=true;
  ring.position.copy(c);
  ring.lookAt(cam.position);
  ring.scale.setScalar((size*.55+.1)*(1+Math.sin(t*6)*.05));
}

let signalWasOn=false;
function updateSignal(now){
  const active=state==='play'&&!paused&&now<signalUntil&&target;
  if(!active){
    el.arrow.style.display='none';
    if(signalWasOn){
      signalWasOn=false;
      el.clue.textContent=clueBase;
      if(!clueBase) el.clue.classList.remove('on');
    }
    return;
  }
  signalWasOn=true;
  const c=new T.Box3().setFromObject(target).getCenter(new T.Vector3());
  const d=Math.hypot(c.x-(me?me.position.x:0), c.z-(me?me.position.z:0));
  const lvl=d<2.2?'HOT':d<4.5?'WARM':'COLD';
  const base=clueBase||'SIGNAL SWEEP';
  el.clue.textContent=base+'   ·   SIGNAL: '+lvl;
  el.clue.classList.add('on');

  const p=c.clone().project(cam);
  const cx=window.innerWidth/2, cy=window.innerHeight/2;
  let ux=(p.x*.5+.5)*window.innerWidth-cx;
  let uy=(-p.y*.5+.5)*window.innerHeight-cy;
  if(p.z>1){ ux=-ux; uy=-uy; }
  const dist=Math.hypot(ux,uy)||1;
  if(dist<95&&p.z<1){ el.arrow.style.display='none'; return; }
  const rad=Math.min(Math.min(window.innerWidth,window.innerHeight)*.3,Math.max(60,dist-70));
  el.arrow.style.display='block';
  el.arrow.style.transform='translate('+(cx+ux/dist*rad)+'px,'+(cy+uy/dist*rad)+'px) translate(-50%,-50%) rotate('+Math.atan2(uy,ux)+'rad) scale('+(1+Math.sin(now/125)*.12)+')';
}

function updateMarkLabel(){
  if(!selected||state!=='play'){
    el.mark.style.display='none';
    if(!selected) selBox.visible=false;
    return;
  }
  selBox.box.setFromObject(selected);
  selBox.visible=true;
  const c=new T.Box3().setFromObject(selected).getCenter(new T.Vector3());
  c.project(cam);
  if(c.z>1){ el.mark.style.display='none'; return; }
  el.mark.style.display='block';
  el.mark.textContent='MARKED · '+selected.userData.label.toUpperCase();
  el.mark.style.left=((c.x*.5+.5)*window.innerWidth)+'px';
  el.mark.style.top=((-c.y*.5+.5)*window.innerHeight-26)+'px';
}

function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-(frame.last||now))/1000); frame.last=now;
  const t=now/1000;

  if(state==='play'&&!paused){
    updateTimer(now);
    if(state==='play'){ movePlayer(dt); updateClues(); }
  } else {
    moving=0;
  }

  if(me&&state!=='won') animPerson(dt,t,moving);
  if(state==='won') endingCamera(dt); else updateCamera(dt);

  if(state==='play'){
    animateProps(t);
    if(hintRing.visible&&target) placeRing(hintRing,target,t);
    if(hovered&&hovered!==selected&&!paused) placeRing(hovRing,hovered,t); else hovRing.visible=false;
    updateMarkLabel();
    updateSignal(now);
  } else {
    hovRing.visible=false;
    if(state!=='won') { hintRing.visible=false; }
  }

  if(purgeObj){
    const k=Math.min(1,(now-purgeT)/650);
    const s=(1-k)*purgeMax;
    purgeObj.scale.setScalar(Math.max(.001,s));
    purgeObj.rotation.y+=.22;
    if(k>=1){ purgeObj.visible=false; purgeObj=null; }
  }

  if(rain){
    const a=rain.a;
    for(let i=0;i<rain.N;i++){
      a[i*6+1]-=.45; a[i*6+4]-=.45;
      if(a[i*6+1]<0){ const y=9+R()*3; a[i*6+1]=y; a[i*6+4]=y-.6; }
    }
    rain.ge.attributes.position.needsUpdate=true;
  }

  if(state==='won') winFrame(now);
  rd.render(sc,cam);
}

/* =========================================================
   BOOT
   ========================================================= */
function buildTextures(){
  TX={};
  TX.tile=cvs(512,512,function(g,w,h){
    g.fillStyle='#17131f'; g.fillRect(0,0,w,h);
    for(let i=0;i<8;i++) for(let j=0;j<8;j++){
      const v=20+R()*14|0;
      g.fillStyle='rgb('+v+','+(v-2)+','+(v+10)+')';
      g.fillRect(i*64+2,j*64+2,60,60);
    }
    noiseSprinkle(g,w,h,1500,.12);
  },[4,5]);
  TX.brick=cvs(512,512,function(g,w,h){
    g.fillStyle='#120e14'; g.fillRect(0,0,w,h);
    for(let y=0;y<8;y++) for(let x=-1;x<5;x++){
      const v=34+R()*30|0;
      g.fillStyle='rgb('+(v+24)+','+(v-4)+','+(v+4)+')';
      g.fillRect(x*128+(y%2?64:0)+3,y*64+3,122,58);
    }
    noiseSprinkle(g,w,h,2500,.18);
  },[5,2]);
  TX.city=cvs(512,384,function(g,w,h){
    const gr=g.createLinearGradient(0,0,0,h);
    gr.addColorStop(0,'#1a0630'); gr.addColorStop(1,'#0a2438');
    g.fillStyle=gr; g.fillRect(0,0,w,h);
    for(let i=0;i<10;i++){
      const bw=40+R()*30, bh=110+R()*180, x=i*54-10;
      g.fillStyle='#0a0612'; g.fillRect(x,h-bh,bw,bh);
      g.fillStyle='#ffd27a';
      for(let y=h-bh+8;y<h-8;y+=16) for(let k=6;k<bw-8;k+=12) if(R()<.4) g.fillRect(x+k,y,5,8);
    }
    g.shadowColor='#ff2bd6'; g.shadowBlur=18;
    g.fillStyle='#ff7aeb'; g.font='56px VT323,monospace'; g.textAlign='center';
    g.fillText('MOTEL - MATRIX_CORE',256,150);
  });
  TX.matrix=cvs(512,300,function(g,w,h){
    g.fillStyle='#000'; g.fillRect(0,0,w,h);
    g.font='14px monospace';
    for(let x=0;x<w;x+=12) for(let y=0;y<h;y+=14) if(R()<.5){
      g.fillStyle=R()<.08?'#d8ffe6':'rgba(34,255,119,'+(.2+R()*.8)+')';
      g.fillText(String.fromCharCode(0x30A0+R()*60),x,y);
    }
  });
  TX.code=cvs(256,160,function(g,w,h){
    g.fillStyle='#02140a'; g.fillRect(0,0,w,h);
    g.fillStyle='#39ff88'; g.font='16px VT323,monospace';
    for(let i=0;i<9;i++) g.fillText('> '+R().toString(36).slice(2,8+(R()*12|0)),8,18+i*16);
  });
}

function init(){
  if(initialised) return;
  initialised=true;
  buildTextures();
  buildScene(0);
  updateHUD();
  showTitle();
  requestAnimationFrame(frame);
}

function showTitle(){
  state='title';
  document.body.classList.remove('playing');
  showScreen({
    eyebrow:'A STORY-DRIVEN ANOMALY HUNT · 3 CHAPTERS · 6 SCANS',
    title:'THE ARCHON LOOP',
    sub:'Cyber-Glitch Motel',
    body:'You checked into Room 304 for one night. That was a hundred loops ago.\n\nThe motel is a simulation, and <em>Archon</em> keeps it running by overwriting anything that remembers the truth — a lamp that floats, a clock that shrinks, a sign that flickers out of existence.\n\nSix scans. Three memories. One way out: <em>stop trusting the room.</em>',
    html:'<ul class="rules"><li>Walk with <em>WASD</em> or the arrow keys. Drag to look around.</li><li><em>Click any object</em> to mark it.</li><li>Press <em>REPORT GLITCH</em> if it is corrupted — or <em>SYSTEM STABLE</em> if the layer is clean.</li><li>A wrong call costs a life. The clock costs you points.</li><li>Stuck? <em>HINT</em> reveals the corruption type, then its location, for 8 seconds each.</li></ul>',
    actions:[['ENTER THE MOTEL',null,function(){ hideScreen(); startRun(); }],
             ['HOW CORRUPTION LOOKS','alt',function(){ showGuide(false); }]]
  });
}

if(document.fonts&&document.fonts.load){
  document.fonts.load('30px VT323').then(init).catch(init);
} else {
  init();
}
setTimeout(init,2500);

})();
</script>
